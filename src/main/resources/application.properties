spring.application.name=ridesharing
server.port=8080

# ==========================================
# Database Configuration (MySQL Default)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ridesharing_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Smart Matching Weights (Percentages totaling 100%)
ridesharing.matching.route-weight=0.50
ridesharing.matching.time-weight=0.20
ridesharing.matching.cost-weight=0.20
ridesharing.matching.seats-weight=0.10

# External Geocoding Config (OpenStreetMap Nominatim)
ridesharing.geocoding.enabled=true
ridesharing.geocoding.nominatim-url=https://nominatim.openstreetmap.org/search
