# ==========================================
# In-Memory Development / Demo Profile (H2)
# ==========================================
spring.datasource.url=jdbc:h2:mem:ridesharing_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Smart Matching Weights
ridesharing.matching.route-weight=0.50
ridesharing.matching.time-weight=0.20
ridesharing.matching.cost-weight=0.20
ridesharing.matching.seats-weight=0.10
ridesharing.geocoding.enabled=true
