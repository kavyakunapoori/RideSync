<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Admin - All Rides')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container" style="margin-top: 30px;">
    <div style="margin-bottom: 20px;">
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary btn-sm">⬅ Back to Admin Dashboard</a>
    </div>

    <div class="card">
        <div class="card-header">
            <h1 class="card-title">Global Ride Records</h1>
            <span class="badge badge-primary" th:text="${#lists.size(rides)} + ' Total Rides'">10 Rides</span>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Ride ID</th>
                        <th>Driver</th>
                        <th>Origin ➔ Destination</th>
                        <th>Departure</th>
                        <th>Seats (Avail/Total)</th>
                        <th>Fare / Seat</th>
                        <th>Status</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${rides}">
                        <td><code th:text="'#' + ${r.id}">#1</code></td>
                        <td>
                            <strong th:text="${r.driver.fullName}">Driver Name</strong>
                            <div style="font-size: 0.8rem; color: var(--text-muted);" th:text="${r.vehicle.displayName}">Car</div>
                        </td>
                        <td>
                            <strong th:text="${r.sourceAddress}">Origin</strong> ➔ <span th:text="${r.destinationAddress}">Dest</span>
                        </td>
                        <td>
                            <div th:text="${r.departureDate}">2026-10-15</div>
                            <small style="color: var(--text-muted);" th:text="${r.departureTime}">08:30</small>
                        </td>
                        <td th:text="${r.availableSeats} + ' / ' + ${r.totalSeats}">3 / 4</td>
                        <td><strong th:text="${'$' + r.passengerCost}">$3.75</strong></td>
                        <td>
                            <span th:if="${r.status.name() == 'PLANNED'}" class="badge badge-success">Planned</span>
                            <span th:if="${r.status.name() == 'ACTIVE'}" class="badge badge-primary">Active</span>
                            <span th:if="${r.status.name() == 'COMPLETED'}" class="badge badge-secondary">Completed</span>
                            <span th:if="${r.status.name() == 'CANCELLED'}" class="badge badge-danger">Cancelled</span>
                        </td>
                        <td th:text="${#temporals.format(r.createdAt, 'MMM dd, HH:mm')}">Oct 14, 08:00</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
