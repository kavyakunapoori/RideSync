<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Admin - Community Reports')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container" style="margin-top: 30px;">
    <div style="margin-bottom: 20px;">
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary btn-sm">⬅ Back to Admin Dashboard</a>
    </div>

    <div class="card">
        <div class="card-header">
            <h1 class="card-title">Community & Safety Reports Queue</h1>
            <span class="badge badge-danger" th:text="${#lists.size(reports)} + ' Reports'">1 Reports</span>
        </div>

        <div th:if="${#lists.isEmpty(reports)}" style="text-align: center; padding: 30px; color: var(--text-muted);">
            No user reports registered in the database.
        </div>

        <div th:if="${!#lists.isEmpty(reports)}" class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Report ID</th>
                        <th>Reporter</th>
                        <th>Reported Entity</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Admin Notes</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${reports}">
                        <td><code th:text="'#' + ${r.id}">#1</code></td>
                        <td>
                            <strong th:text="${r.reporter.fullName}">Reporter</strong>
                            <div style="font-size: 0.8rem; color: var(--text-muted);" th:text="${r.reporter.email}">email</div>
                        </td>
                        <td>
                            <div th:if="${r.reportedUser != null}">User: <strong th:text="${r.reportedUser.fullName}">Target</strong></div>
                            <div th:if="${r.reportedRide != null}">Ride: <code th:text="'#' + ${r.reportedRide.id}">#1</code></div>
                        </td>
                        <td th:text="${r.reason}">Reason text</td>
                        <td>
                            <span th:if="${r.status.name() == 'PENDING'}" class="badge badge-warning">Pending</span>
                            <span th:if="${r.status.name() == 'RESOLVED'}" class="badge badge-success">Resolved</span>
                            <span th:if="${r.status.name() == 'DISMISSED'}" class="badge badge-secondary">Dismissed</span>
                        </td>
                        <td>
                            <span th:text="${r.adminNotes != null ? r.adminNotes : 'None'}">None</span>
                        </td>
                        <td>
                            <form th:if="${r.status.name() == 'PENDING'}" th:action="@{/admin/reports/{id}/resolve(id=${r.id})}" method="post">
                                <div style="display: flex; gap: 4px;">
                                    <input type="text" name="adminNotes" placeholder="Admin note" class="form-control" style="font-size: 0.8rem; padding: 4px 8px; width: 140px;">
                                    <button type="submit" class="btn btn-primary btn-sm">Resolve</button>
                                </div>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
