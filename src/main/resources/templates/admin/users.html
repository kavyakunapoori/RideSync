<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Admin - Manage Users')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container" style="margin-top: 30px;">
    <div style="margin-bottom: 20px;">
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary btn-sm">⬅ Back to Admin Dashboard</a>
    </div>

    <div class="card">
        <div class="card-header">
            <h1 class="card-title">User Account Governance</h1>
            <span class="badge badge-primary" th:text="${#lists.size(users)} + ' Registered Users'">10 Users</span>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Roles</th>
                        <th>Status</th>
                        <th>Joined Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td><code th:text="'#' + ${u.id}">#1</code></td>
                        <td><strong th:text="${u.fullName}">User Name</strong></td>
                        <td th:text="${u.email}">email@example.com</td>
                        <td>
                            <span th:each="r : ${u.roles}" class="badge badge-secondary" style="margin-right: 4px;" th:text="${r.name.replace('ROLE_', '')}">PASSENGER</span>
                        </td>
                        <td>
                            <span th:if="${u.active}" class="badge badge-success">Active</span>
                            <span th:if="${!u.active}" class="badge badge-danger">Deactivated</span>
                        </td>
                        <td th:text="${#temporals.format(u.createdAt, 'MMM dd, yyyy')}">Oct 14, 2026</td>
                        <td>
                            <form th:action="@{/admin/users/{id}/toggle-status(id=${u.id})}" method="post" style="display:inline;">
                                <button type="submit" 
                                        th:class="${u.active} ? 'btn btn-danger btn-sm' : 'btn btn-success btn-sm'"
                                        th:text="${u.active} ? 'Deactivate' : 'Activate'"
                                        th:disabled="${u.hasRole('ROLE_ADMIN') && u.id == currentUser.id}"
                                        onclick="return confirm('Change user active status?');">
                                    Toggle
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
