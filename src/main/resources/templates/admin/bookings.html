<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Admin - All Bookings')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container" style="margin-top: 30px;">
    <div style="margin-bottom: 20px;">
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary btn-sm">⬅ Back to Admin Dashboard</a>
    </div>

    <div class="card">
        <div class="card-header">
            <h1 class="card-title">Global Passenger Bookings</h1>
            <span class="badge badge-primary" th:text="${#lists.size(bookings)} + ' Total Bookings'">10 Bookings</span>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Booking ID</th>
                        <th>Passenger</th>
                        <th>Driver & Ride</th>
                        <th>Booked Seats</th>
                        <th>Total Fare</th>
                        <th>Status</th>
                        <th>Booking Time</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="b : ${bookings}">
                        <td><code th:text="'#' + ${b.id}">#1</code></td>
                        <td>
                            <strong th:text="${b.passenger.fullName}">Passenger</strong>
                            <div style="font-size: 0.8rem; color: var(--text-muted);" th:text="${b.passenger.email}">email</div>
                        </td>
                        <td>
                            <strong th:text="${b.ride.driver.fullName}">Driver</strong>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">
                                Ride #<span th:text="${b.ride.id}">1</span> (<span th:text="${b.ride.sourceAddress} + ' ➔ ' + ${b.ride.destinationAddress}">Route</span>)
                            </div>
                        </td>
                        <td th:text="${b.seatsBooked}">1</td>
                        <td><strong th:text="${'$' + b.totalFare}">$3.75</strong></td>
                        <td>
                            <span th:if="${b.status.name() == 'CONFIRMED'}" class="badge badge-success">Confirmed</span>
                            <span th:if="${b.status.name() == 'PENDING'}" class="badge badge-warning">Pending</span>
                            <span th:if="${b.status.name() == 'COMPLETED'}" class="badge badge-primary">Completed</span>
                            <span th:if="${b.status.name() == 'CANCELLED'}" class="badge badge-danger">Cancelled</span>
                            <span th:if="${b.status.name() == 'REJECTED'}" class="badge badge-danger">Declined</span>
                        </td>
                        <td th:text="${#temporals.format(b.bookingTime, 'MMM dd, yyyy HH:mm')}">Oct 14, 2026</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
