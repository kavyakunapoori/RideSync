<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Driver Ratings & Reviews')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container" style="max-width: 800px; margin-top: 30px;">
    <div style="margin-bottom: 20px;">
        <a th:href="@{/driver/dashboard}" class="btn btn-secondary btn-sm">⬅ Back to Driver Dashboard</a>
    </div>

    <div class="card">
        <div class="card-header">
            <h1 class="card-title">Driver Performance & Passenger Reviews</h1>
            <div style="font-size: 1.25rem; font-weight: 800; color: #eab308;">
                <span th:if="${avgRating != null}" th:text="${avgRating + ' ★'}">5.0 ★</span>
                <span th:if="${avgRating == null}">No Ratings Yet</span>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(reviews)}" style="text-align: center; padding: 40px; color: var(--text-muted);">
            <p>You haven't received any reviews yet. Complete trips with passengers to earn ratings!</p>
        </div>

        <div th:each="r : ${reviews}" style="border-bottom: 1px solid var(--border-color); padding: 18px 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <strong style="font-size: 1rem; color: #1e293b;" th:text="${r.passenger.fullName}">Alice</strong>
                <span style="color: #eab308; font-weight: 700;" th:text="${'★'.repeat(r.score)} + ' (' + ${r.score} + '/5)'">★★★★★ (5/5)</span>
            </div>
            <p style="color: #334155; font-size: 0.95rem; margin-bottom: 6px;" th:text="${r.comment}">Great ride!</p>
            <div style="font-size: 0.8rem; color: var(--text-muted);">
                Trip: <span th:text="${r.ride.sourceAddress} + ' ➔ ' + ${r.ride.destinationAddress}">Route</span> •
                <span th:text="${#temporals.format(r.createdAt, 'MMM dd, yyyy')}">Oct 14, 2026</span>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
