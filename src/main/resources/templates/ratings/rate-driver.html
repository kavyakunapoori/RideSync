<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Rate Driver')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container" style="max-width: 600px; margin-top: 30px;">
    <div style="margin-bottom: 20px;">
        <a th:href="@{/passenger/bookings}" class="btn btn-secondary btn-sm">⬅ Back to Bookings</a>
    </div>

    <div class="card" style="box-shadow: var(--shadow-md);">
        <div class="card-header">
            <h1 class="card-title">Rate & Review Your Driver</h1>
            <span class="badge badge-success">Completed Trip</span>
        </div>

        <!-- Trip Summary -->
        <div style="background: #f8fafc; border: 1px solid var(--border-color); padding: 16px; border-radius: var(--radius-sm); margin-bottom: 20px;">
            <div style="font-size: 1.05rem; font-weight: 700; color: var(--primary);">
                <span th:text="${booking.ride.sourceAddress}">Origin</span> ➔ <span th:text="${booking.ride.destinationAddress}">Destination</span>
            </div>
            <div style="color: #64748b; font-size: 0.9rem; margin-top: 4px;">
                Driver: <strong th:text="${booking.ride.driver.fullName}">John Driver</strong> • 
                Vehicle: <span th:text="${booking.ride.vehicle.displayName}">Car</span>
            </div>
        </div>

        <form th:action="@{/ratings/booking/{id}(id=${booking.id})}" th:object="${ratingDto}" method="post">
            <div class="form-group">
                <label for="score" class="form-label">Overall Rating (1 to 5 Stars) *</label>
                <select id="score" th:field="*{score}" class="form-control" style="font-size: 1.1rem; font-weight: 700;">
                    <option value="5">★★★★★ 5 - Outstanding & Safe</option>
                    <option value="4">★★★★☆ 4 - Good & On-Time</option>
                    <option value="3">★★★☆☆ 3 - Average</option>
                    <option value="2">★★☆☆☆ 2 - Below Expectations</option>
                    <option value="1">★☆☆☆☆ 1 - Poor Experience</option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('score')}" th:errors="*{score}"></div>
            </div>

            <div class="form-group">
                <label for="comment" class="form-label">Review Feedback (Optional)</label>
                <textarea id="comment" th:field="*{comment}" rows="4" class="form-control" placeholder="Share your experience (punctuality, driving comfort, friendliness)..."></textarea>
                <div class="text-danger" th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}"></div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px;">
                <a th:href="@{/passenger/bookings}" class="btn btn-secondary">Skip for now</a>
                <button type="submit" class="btn btn-primary">Submit Rating</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
